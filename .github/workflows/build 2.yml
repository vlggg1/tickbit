name: Build and deploy TickBit

on:
  schedule:
    - cron: "0 */3 * * *"   # на всеки 3 часа
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tickbit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          NEWSLETTER_ACTION: ${{ vars.NEWSLETTER_ACTION }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      - name: Save summaries cache
        run: |
          git config user.name "tickbit-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p data drafts && touch drafts/.gitkeep
          git add data drafts
          git commit -m "Update cache and drafts" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
