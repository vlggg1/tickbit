name: Build and deploy TickBit

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tickbit
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          NEWSLETTER_ACTION: ${{ vars.NEWSLETTER_ACTION }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
      - name: Save story archive
        run: |
          git config user.name "tickbit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "Update story archive" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
